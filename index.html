<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        .container {
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 2rem;
            background-color: #f8f9fa;
        }
        h1 { color: #007bff; }
        .status {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2rem;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 娇娇 哈哈 GitHub Pages 部署成功！</h1>
        <p class="status">当前状态：在线 (Online)</p>
        <hr>
        <p>这是一个用于测试静态托管服务的页面。</p>
        <p>如果你能看到这个页面，说明你的 GitHub 仓库配置和部署流程一切正常。</p>

        <!-- 简单的交互测试 -->
        <button onclick="checkTime()">点击检查部署时间</button>
        <p id="time-display"></p>
    </div>

    <script>
        function checkTime() {
            const now = new Date();
            document.getElementById('time-display').innerText =
                "当前访问时间：" + now.toLocaleString();
        }
    </script>
</body>
</html>
